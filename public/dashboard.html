<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AYAC 2026 · Admin Dashboard</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: #f4f7fc;
      padding: 1.5rem;
      color: #1e293b;
    }

    .dashboard-wrapper {
      max-width: 1440px;
      margin: 0 auto;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    h1 i { color: #2563eb; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: white;
      padding: 1.25rem 1rem;
      border-radius: 16px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.03);
      border: 1px solid #e9edf2;
    }

    .stat-card .label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
    }

    .stat-card .value {
      font-size: 1.8rem;
      font-weight: 700;
      margin-top: 0.25rem;
    }

    .chart-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .chart-box {
      background: white;
      padding: 1rem 1rem 0.5rem;
      border-radius: 16px;
      border: 1px solid #e9edf2;
      box-shadow: 0 4px 8px rgba(0,0,0,0.02);
    }

    .chart-box h3 {
      font-weight: 500;
      font-size: 1rem;
      margin-bottom: 0.5rem;
      color: #334155;
    }

    .chart-box canvas {
      max-height: 160px;
      max-width: 100%;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1rem;
      background: white;
      padding: 0.75rem 1.2rem;
      border-radius: 40px;
      margin-bottom: 1.5rem;
      border: 1px solid #e2e8f0;
    }

    .search-wrapper {
      flex: 2 1 240px;
      display: flex;
      align-items: center;
      background: #f1f5f9;
      border-radius: 40px;
      padding: 0.25rem 0.9rem;
    }

    .search-wrapper i {
      color: #64748b;
      font-size: 0.9rem;
      margin-right: 8px;
    }

    .search-wrapper input {
      border: none;
      background: transparent;
      padding: 0.5rem 0;
      width: 100%;
      font-size: 0.9rem;
      outline: none;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }

    .filter-group select, .filter-group button {
      padding: 0.4rem 0.9rem;
      border-radius: 40px;
      border: 1px solid #d1d9e6;
      background: white;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.15s;
    }

    .filter-group select { background: #f8fafc; }
    .filter-group button {
      background: #f1f5f9;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .filter-group button:hover { background: #e2e8f0; }
    .filter-group button.active-sort {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    .doc-badge {
      background: #e9edf2;
      border-radius: 30px;
      padding: 0.2rem 0.8rem;
      font-size: 0.7rem;
      color: #334155;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: help;
    }

    .table-container {
      background: white;
      border-radius: 20px;
      padding: 0.2rem 0;
      border: 1px solid #e9edf2;
      overflow-x: auto;
      box-shadow: 0 8px 20px rgba(0,0,0,0.02);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      min-width: 900px;
    }

    th {
      background: #f8fafc;
      text-align: left;
      padding: 0.9rem 0.7rem;
      font-weight: 600;
      color: #1e293b;
      border-bottom: 1px solid #e2e8f0;
      white-space: nowrap;
    }

    td {
      padding: 0.7rem;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
    }

    tr:hover td { background: #fafcff; }

    .view-btn, .delete-btn {
      padding: 4px 12px;
      border: none;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s;
      text-decoration: none;
      display: inline-block;
    }

    .view-btn {
      background: #e0edff;
      color: #1e4f8a;
    }
    .view-btn:hover { background: #c7ddfa; }

    .delete-btn {
      background: #fee2e2;
      color: #b91c1c;
      margin-left: 4px;
    }
    .delete-btn:hover { background: #fecaca; }

    .pagination-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      gap: 0.5rem;
    }

    .pagination-controls .info {
      font-size: 0.9rem;
      color: #475569;
    }

    .pagination-buttons {
      display: flex;
      gap: 5px;
    }

    .pagination-buttons button {
      padding: 0.3rem 0.8rem;
      border-radius: 30px;
      border: 1px solid #d1d9e6;
      background: white;
      cursor: pointer;
      font-weight: 500;
      transition: 0.1s;
    }

    .pagination-buttons button.active-page {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    .pagination-buttons button:disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .footer-note {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    @media (max-width: 700px) {
      .chart-row { grid-template-columns: 1fr; }
      .toolbar { flex-direction: column; align-items: stretch; border-radius: 24px; }
      .filter-group { flex-wrap: wrap; }
      body { padding: 0.8rem; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: 1fr; }
    }

    /* ID search hint */
    .search-hint {
      font-size: 0.7rem;
      color: #64748b;
      margin-left: 6px;
      background: #eef2f6;
      padding: 0.1rem 0.6rem;
      border-radius: 30px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
<div class="dashboard-wrapper">

  <h1><i class="fas fa-chart-pie"></i> AYAC 2026 · Admin</h1>

  <!-- stats -->
  <div class="stats-grid">
    <div class="stat-card"><div class="label">Total registrations</div><div class="value" id="total-count">0</div></div>
    <div class="stat-card"><div class="label">Churches</div><div class="value" id="church-count">0</div></div>
    <div class="stat-card"><div class="label">Age 18–25</div><div class="value" id="young-count">0</div></div>
    <div class="stat-card"><div class="label">Accommodation</div><div class="value" id="acc-count">0</div></div>
  </div>

  <!-- charts -->
  <div class="chart-row">
    <div class="chart-box"><h3><i class="fas fa-building"></i> Participants per church</h3><canvas id="churchChart"></canvas></div>
    <div class="chart-box"><h3><i class="fas fa-venus-mars"></i> Age group distribution</h3><canvas id="ageChart"></canvas></div>
  </div>

  <!-- toolbar -->
  <div class="toolbar">
    <div class="search-wrapper">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Search by name, email, church or ID..." />
      <span class="search-hint"><i class="fas fa-hashtag"></i> ID</span>
    </div>
    <div class="filter-group">
      <select id="filterChurch"><option value="">All churches</option></select>
      <select id="filterCluster"><option value="">All clusters</option></select>
      <button id="sortToggle"><i class="fas fa-sort"></i> Sort</button>
      <span class="doc-badge" title="Search also matches numeric ID · Sort toggles A↔Z"><i class="fas fa-info-circle"></i> docs</span>
    </div>
  </div>

  <!-- table -->
  <div class="table-container">
    <table>
      <thead><tr>
        <th>Id</th><th>Full Name</th><th>Email</th><th>Phone</th><th>Group</th>
        <th>Church</th><th>Cluster</th><th>County</th><th>Age</th><th>Accom.</th><th>Action</th>
      </tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- pagination -->
  <div class="pagination-controls">
    <div class="info" id="paginationInfo">Showing 0–0 of 0</div>
    <div class="pagination-buttons" id="paginationButtons"></div>
  </div>

  <div class="footer-note">
    <span><i class="fas fa-check-circle" style="color:#2563eb;"></i> Delete · View (demo)</span>
    <span><i class="fas fa-mobile-alt"></i> Responsive · charts live</span>
  </div>
</div>

<script>
  (function() {
    // ----- state -----
    const API_URL = "https://more-mrb9.onrender.com/tags_info";
    let allData = [];
    let filteredData = [];
    let currentPage = 1;
    const pageSize = 8;
    let sortAsc = true;       // by fullName

    // DOM
    const tbody = document.getElementById('tableBody');
    const totalSpan = document.getElementById('total-count');
    const churchCountSpan = document.getElementById('church-count');
    const youngSpan = document.getElementById('young-count');
    const accSpan = document.getElementById('acc-count');
    const searchInput = document.getElementById('searchInput');
    const filterChurch = document.getElementById('filterChurch');
    const filterCluster = document.getElementById('filterCluster');
    const sortBtn = document.getElementById('sortToggle');
    const paginationInfo = document.getElementById('paginationInfo');
    const paginationButtons = document.getElementById('paginationButtons');

    let churchChartInstance = null;
    let ageChartInstance = null;

    // ----- helpers -----
    function extractChurchList(data) {
      const set = new Set();
      data.forEach(d => { if (d.church) set.add(d.church); });
      return Array.from(set).sort();
    }

    function extractClusterList(data) {
      const set = new Set();
      data.forEach(d => { if (d.cluster) set.add(d.cluster); });
      return Array.from(set).sort();
    }

    function updateFilterOptions(data) {
      const churches = extractChurchList(data);
      filterChurch.innerHTML = '<option value="">All churches</option>';
      churches.forEach(c => {
        filterChurch.innerHTML += `<option value="${c}">${c}</option>`;
      });
      const clusters = extractClusterList(data);
      filterCluster.innerHTML = '<option value="">All clusters</option>';
      clusters.forEach(c => {
        filterCluster.innerHTML += `<option value="${c}">${c}</option>`;
      });
    }

    // main filter + sort
    function applyFiltersAndSort() {
      const searchTerm = searchInput.value.toLowerCase().trim();
      const churchVal = filterChurch.value;
      const clusterVal = filterCluster.value;

      let temp = allData.filter(item => {
        // SEARCH: name, email, church, AND now also ID (numeric or string)
        const idStr = String(item.id ?? '').toLowerCase();
        const name = (item.fullName || '').toLowerCase();
        const email = (item.email || '').toLowerCase();
        const church = (item.church || '').toLowerCase();
        const matchSearch = 
          name.includes(searchTerm) ||
          email.includes(searchTerm) ||
          church.includes(searchTerm) ||
          idStr.includes(searchTerm);   // <-- ID search added

        const matchChurch = churchVal === '' || item.church === churchVal;
        const matchCluster = clusterVal === '' || item.cluster === clusterVal;
        return matchSearch && matchChurch && matchCluster;
      });

      // sort by fullName
      temp.sort((a, b) => {
        const nameA = (a.fullName || '').toLowerCase();
        const nameB = (b.fullName || '').toLowerCase();
        if (nameA < nameB) return sortAsc ? -1 : 1;
        if (nameA > nameB) return sortAsc ? 1 : -1;
        return 0;
      });

      filteredData = temp;
      currentPage = 1;
      renderPage();
      updateStatsAndCharts(filteredData);
      updatePaginationInfo();
    }

    function renderPage() {
      const start = (currentPage - 1) * pageSize;
      const pageItems = filteredData.slice(start, start + pageSize);
      renderTable(pageItems);
      updatePaginationButtons();
    }

    function renderTable(data) {
      tbody.innerHTML = '';
      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="11" style="text-align:center;padding:1.5rem;">No participants found</td></tr>`;
        return;
      }
      data.forEach(reg => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${reg.id ?? ''}</td>
          <td>${reg.fullName ?? ''}</td>
          <td>${reg.email ?? ''}</td>
          <td>${reg.phone ?? ''}</td>
          <td>${reg.color ?? ''}</td>
          <td>${reg.church ?? ''}</td>
          <td>${reg.cluster ?? ''}</td>
          <td>${reg.country ?? ''}</td>
          <td>${reg.ageGroup ?? ''}</td>
          <td>${reg.accommodation ?? ''}</td>
          <td>
            <a href="/participant/${reg.id}" class="view-btn"><i class="fas fa-eye"></i> View</a>
            <button class="delete-btn" data-id="${reg._id}"><i class="fas fa-trash"></i></button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      // delete handlers
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = e.currentTarget.getAttribute('data-id');
          if (!id) return;
          if (!confirm('Delete this participant?')) return;
          fetch(`https://more-mrb9.onrender.com/tags_info/${id}`, { method: 'DELETE' })
            .then(res => {
              if (!res.ok) throw new Error('Delete failed');
              allData = allData.filter(d => d._id !== id);
              applyFiltersAndSort();
              alert('Deleted successfully.');
            })
            .catch(err => {
              alert('Error deleting.');
              console.error(err);
            });
        });
      });
    }

    // stats + charts
    function updateStatsAndCharts(data) {
      totalSpan.textContent = data.length;
      const churchSet = new Set(data.map(d => d.church).filter(Boolean));
      churchCountSpan.textContent = churchSet.size;
      const young = data.filter(d => d.ageGroup === '18-25').length;
      youngSpan.textContent = young;
      const acc = data.filter(d => d.accommodation && d.accommodation.toLowerCase().includes('yes')).length;
      accSpan.textContent = acc;

      renderCharts(data);
    }

    function renderCharts(data) {
      const churchMap = {};
      data.forEach(d => {
        const c = d.church || 'Other';
        churchMap[c] = (churchMap[c] || 0) + 1;
      });
      const churchLabels = Object.keys(churchMap);
      const churchValues = Object.values(churchMap);

      if (churchChartInstance) churchChartInstance.destroy();
      const ctx1 = document.getElementById('churchChart').getContext('2d');
      churchChartInstance = new Chart(ctx1, {
        type: 'bar',
        data: {
          labels: churchLabels.slice(0, 8),
          datasets: [{ label: 'Participants', data: churchValues.slice(0, 8), backgroundColor: '#3b82f6' }]
        },
        options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } } }
      });

      const ageMap = {};
      data.forEach(d => {
        const a = d.ageGroup || 'Unknown';
        ageMap[a] = (ageMap[a] || 0) + 1;
      });
      const ageLabels = Object.keys(ageMap);
      const ageValues = Object.values(ageMap);
      if (ageChartInstance) ageChartInstance.destroy();
      const ctx2 = document.getElementById('ageChart').getContext('2d');
      ageChartInstance = new Chart(ctx2, {
        type: 'doughnut',
        data: {
          labels: ageLabels,
          datasets: [{ data: ageValues, backgroundColor: ['#2563eb','#8b5cf6','#f59e0b','#ef4444','#10b981'] }]
        },
        options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { boxWidth: 8 } } } }
      });
    }

    function updatePaginationInfo() {
      const total = filteredData.length;
      const start = (currentPage - 1) * pageSize + 1;
      const end = Math.min(currentPage * pageSize, total);
      paginationInfo.textContent = total === 0 ? 'No entries' : `Showing ${start}–${end} of ${total}`;
    }

    function updatePaginationButtons() {
      const total = filteredData.length;
      const totalPages = Math.ceil(total / pageSize) || 1;
      let html = '';
      html += `<button ${currentPage===1?'disabled':''} data-page="prev"><i class="fas fa-chevron-left"></i></button>`;
      for (let i=1; i<=totalPages; i++) {
        html += `<button class="${i===currentPage?'active-page':''}" data-page="${i}">${i}</button>`;
      }
      html += `<button ${currentPage===totalPages?'disabled':''} data-page="next"><i class="fas fa-chevron-right"></i></button>`;
      paginationButtons.innerHTML = html;

      paginationButtons.querySelectorAll('button[data-page]').forEach(btn => {
        btn.addEventListener('click', () => {
          const val = btn.dataset.page;
          if (val === 'prev' && currentPage > 1) { currentPage--; }
          else if (val === 'next' && currentPage < totalPages) { currentPage++; }
          else if (!isNaN(val)) { currentPage = parseInt(val); }
          renderPage();
          updatePaginationInfo();
        });
      });
    }

    // ----- fetch -----
    function loadData() {
      fetch(API_URL)
        .then(res => {
          if (!res.ok) throw new Error('Network error');
          return res.json();
        })
        .then(data => {
          allData = data;
          updateFilterOptions(allData);
          applyFiltersAndSort();
        })
        .catch(err => {
          alert('⚠️ Failed to load data. Please check server or API.');
          console.error(err);
          tbody.innerHTML = `<tr><td colspan="11" style="text-align:center;padding:2rem;color:#b91c1c;">⚠️ Error loading data. Make sure server is running.</td></tr>`;
        });
    }

    // ----- events -----
    searchInput.addEventListener('input', applyFiltersAndSort);
    filterChurch.addEventListener('change', applyFiltersAndSort);
    filterCluster.addEventListener('change', applyFiltersAndSort);

    sortBtn.addEventListener('click', () => {
      sortAsc = !sortAsc;
      sortBtn.innerHTML = sortAsc ? '<i class="fas fa-sort-up"></i> Sort A→Z' : '<i class="fas fa-sort-down"></i> Sort Z→A';
      applyFiltersAndSort();
    });

    loadData();
  })();
</script>
</body>
</html>
